version: "3.9"

services:
  aegis-backend:
    build: .
    container_name: aegis-backend
    ports:
      - "5000:5000"
    volumes:
      - ./reports:/app/reports   # persist generated reports
    environment:
      - FLASK_ENV=production
    restart: unless-stopped

  # Optional: OWASP Juice Shop for safe testing
  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Optional: DVWA for safe testing
  dvwa:
    image: vulnerables/web-dvwa
    container_name: dvwa
    ports:
      - "8080:80"
    restart: unless-stopped